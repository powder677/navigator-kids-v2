<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Child is an Intense Feeler | Navigator Kids</title>
    <style>
       :root {
          --color-navy: #002347;
          --color-gold: #D4AF37;
          --color-terracotta: #D44D5C;
          --color-terracotta-light: #FCE8E8;
          --color-cream: #FFF8E7;
          --color-white: #ffffff;
          --color-text: #333333;
          --color-text-light: #666666;
          --radius-md: 12px;
          --radius-xl: 20px;
          --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
          --shadow-lg: 0 15px 40px rgba(0, 0, 0, 0.1);
          --font-body: 'Inter', sans-serif;
          --font-heading: 'Merriweather', serif;
       }

       * { box-sizing: border-box; }

       body {
          font-family: var(--font-body);
          color: var(--color-text);
          line-height: 1.6;
          margin: 0;
          background-color: #fdfdfd;
          padding-top: 76px;
       }
       
       #header + * { margin-top: 0; }

       h1, h2, h3, h4 {
          font-family: var(--font-heading);
          color: var(--color-navy);
          margin-top: 0;
       }

       .container {
          max-width: 900px;
          margin: 0 auto;
          padding: 0 20px;
       }

       .result-hero {
          background: linear-gradient(135deg, var(--color-terracotta-light) 0%, #FDF0F0 100%);
          padding: 60px 0 40px;
          text-align: center;
       }

       .result-hero-badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: var(--color-white);
          padding: 6px 16px;
          border-radius: 50px;
          font-size: 0.85rem;
          font-weight: 600;
          color: var(--color-terracotta);
          margin-bottom: 24px;
          box-shadow: var(--shadow-sm);
       }

       .result-hero h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 16px; }
       .result-hero-subtitle { font-size: 1.15rem; color: var(--color-text); max-width: 600px; margin: 0 auto; }

       .validation-section { padding: 60px 0; background: var(--color-white); }
       .validation-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
       @media (max-width: 768px) { .validation-grid { grid-template-columns: 1fr; } }

       .validation-list { list-style: none; padding: 0; margin-top: 20px; }
       .validation-list li { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; font-size: 1rem; }
       .validation-list li::before { content: '✓'; color: var(--color-terracotta); font-weight: 700; flex-shrink: 0; }

       .symptom-card {
          background: #FDF0F0;
          border-radius: var(--radius-md);
          padding: 16px;
          margin-bottom: 12px;
          display: flex;
          align-items: center;
          gap: 16px;
          border-left: 4px solid var(--color-terracotta);
       }
       .symptom-icon { font-size: 1.5rem; }
       .symptom-card p { margin: 0; font-size: 0.9rem; font-weight: 500; }

       .urgency-band {
          background-color: var(--color-navy);
          color: var(--color-cream);
          padding: 30px 20px;
          text-align: center;
          margin: 40px 0;
          border-left: 6px solid var(--color-terracotta);
          border-radius: 4px;
       }

       .hero-offer {
          border: 3px solid var(--color-terracotta);
          background: var(--color-white);
          padding: 40px;
          border-radius: var(--radius-md);
          box-shadow: var(--shadow-lg);
          position: relative;
          text-align: center;
          margin-bottom: 60px;
          overflow: hidden;
       }

       .hero-badge {
          background: var(--color-terracotta);
          color: var(--color-white);
          position: absolute;
          top: 0;
          right: 0;
          padding: 8px 20px;
          font-weight: bold;
          font-size: 0.85rem;
          border-bottom-left-radius: 12px;
       }

       .offer-list { text-align: left; margin: 20px auto; max-width: 450px; line-height: 1.8; }
       .price-anchor { text-decoration: line-through; color: #888; font-size: 1.1rem; margin-right: 10px; }
       .price-main { font-size: 2.5rem; font-weight: 800; color: var(--color-navy); }

       .btn-primary {
          background-color: var(--color-terracotta);
          color: white;
          width: 100%;
          max-width: 500px;
          padding: 18px;
          font-size: 1.2rem;
          font-weight: bold;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          margin-top: 20px;
          transition: transform 0.2s;
       }
       .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }

       .quickwin-section {
          background: linear-gradient(135deg, var(--color-terracotta-light) 0%, #FDF0F0 100%);
          padding: 50px 0;
          margin-top: 60px;
          border-radius: var(--radius-xl);
       }

       .step-circle {
          width: 24px;
          height: 24px;
          background: var(--color-terracotta);
          color: white;
          border-radius: 50%;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          font-size: 0.75rem;
          font-weight: bold;
          margin-right: 10px;
       }

       .downsell-section { margin-top: 60px; padding-top: 40px; border-top: 1px solid #eee; }
       .downsell-grid { display: flex; gap: 30px; flex-wrap: wrap; }

       .downsell-card {
          flex: 1;
          min-width: 300px;
          padding: 30px;
          border-radius: var(--radius-md);
          position: relative;
          background: white;
          border: 1px solid #eee;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
          transition: transform 0.2s, box-shadow 0.2s;
          display: flex;
          flex-direction: column;
       }
       .downsell-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); }

       .card-parent { border-top: 5px solid var(--color-navy); }
       .card-kid { border-top: 5px solid var(--color-terracotta); }

       .card-badge {
          position: absolute;
          top: -14px;
          left: 50%;
          transform: translateX(-50%);
          background: #f0f0f0;
          padding: 5px 15px;
          border-radius: 50px;
          font-size: 0.75rem;
          font-weight: 700;
          letter-spacing: 1px;
          color: #555;
          text-transform: uppercase;
          border: 2px solid white;
       }

       .downsell-card h3 { font-size: 1.3rem; margin-top: 10px; margin-bottom: 10px; text-align: center; color: var(--color-navy); }
       .card-desc { font-size: 0.95rem; color: #666; text-align: center; margin-bottom: 20px; line-height: 1.5; min-height: 3rem; }
       
       .card-features { margin: 0 0 25px 0; padding: 15px 0; list-style: none; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
       .card-features li { margin-bottom: 8px; font-size: 0.9rem; display: flex; align-items: start; gap: 10px; color: var(--color-text); }
       .card-features li::before { content: '•'; color: #ccc; font-weight: bold; font-size: 1.2em; line-height: 1; }

       .card-price { text-align: center; margin-bottom: 15px; margin-top: auto; }
       .price-val { font-size: 2.2rem; font-weight: 700; color: var(--color-navy); }

       .btn-secondary {
          background: white;
          border: 2px solid var(--color-navy);
          color: var(--color-navy);
          width: 100%;
          padding: 14px;
          font-weight: 700;
          border-radius: 8px;
          cursor: pointer;
          transition: all 0.2s;
       }
       .btn-secondary:hover { background: var(--color-navy); color: white; }
    </style>
</head>
