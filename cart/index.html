<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Your Cart | Navigator Kids AI</title>
   
   <link rel="stylesheet" href="/css/styles.css">
   
   <script src="https://cdn.tailwindcss.com"></script>

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
   <script src="/js/components.js" defer></script>
   <script src="/js/cart.js" defer></script>

   <style>
      :root {
         /* Premium Palette Overrides */
         --color-navy: #3D405B;
         --color-sage: #81B29A;
         --color-sage-light: #A8D0BA;
         --color-terracotta: #E07A5F;
         --color-cream: #F9F7F2;
         --color-white: #FFFFFF;
         --color-text: #4A4E69;
         --bg-color: #F9FAFB;
      }

      body {
         font-family: 'Inter', sans-serif;
         background-color: var(--bg-color);
         color: var(--color-text);
         display: flex;
         flex-direction: column;
         min-height: 100vh;
      }

      h1, h2, h3, h4, .font-heading {
         font-family: 'Merriweather', serif;
         color: var(--color-navy);
      }
      
      /* Fix for Cart JS rendering */
      #cartContainer {
          min-height: 400px;
          width: 100%;
          max-width: 900px; /* Constrain width for better readability */
          margin: 0 auto;
      }

      /* Ensure Tailwind doesn't hide your cart buttons */
      .btn {
          display: inline-flex !important; 
          align-items: center;
          justify-content: center;
      }
   </style>
</head>

<body class="antialiased">

   <div id="header"></div>

   <main class="container mx-auto px-4 py-12 flex-grow">
      
      <div class="flex items-center gap-2 mb-8 text-sm max-w-[900px] mx-auto">
         <a href="/products/" class="text-gray-500 hover:text-[#E07A5F] transition font-medium no-underline flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Continue Shopping
         </a>
      </div>

      <div id="cartContainer">
         <div class="max-w-2xl mx-auto text-center py-20 bg-white rounded-2xl shadow-sm border border-gray-100">
            <div class="animate-spin inline-block w-10 h-10 border-4 border-[#E07A5F] border-t-transparent rounded-full mb-4" role="status" aria-label="loading"></div>
            <p class="text-gray-500 text-lg">Loading your cart...</p>
         </div>
      </div>

   </main>

   <div id="footer"></div>

   <script>
      // SAFETY CHECK: Force the cart to render if it gets stuck
      window.addEventListener('load', function() {
         setTimeout(function() {
             const container = document.getElementById('cartContainer');
             // If still showing loading text after 500ms, kickstart it
             if(container && container.innerHTML.includes('Loading')) {
                 console.log("Kickstarting Cart Render...");
                 if (window.NavigatorCart && window.NavigatorCart.renderCartPage) {
                     window.NavigatorCart.renderCartPage();
                 } else {
                     // Fallback event dispatch
                     window.dispatchEvent(new CustomEvent('cartUpdated', { detail: {} }));
                 }
             }
         }, 500);
      });
   </script>

</body>
</html>
