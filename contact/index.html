<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Contact Us | Navigator Kids AI™</title>
   <meta name="description" content="Questions about your creative or high-potential child? Reach out to Navigator Kids AI. We're here to help you understand and support your unique learner.">

   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

   <link rel="stylesheet" href="styles.css">

   <style>
      .contact-layout {
         max-width: 600px;
         margin: 120px auto 100px;
         padding: 0 24px;
      }

      /* Added top margin for fixed header */
      .page-header {
         text-align: center;
         margin-bottom: 40px;
      }

      .page-header h1 {
         font-size: 2.5rem;
         margin-bottom: 16px;
         color: var(--color-primary);
      }

      .page-header p {
         font-size: 1.1rem;
         color: var(--color-text-muted);
      }

      .contact-form {
         background: white;
         padding: 40px;
         border-radius: var(--border-radius-lg);
         box-shadow: var(--shadow-sm);
         border-top: 4px solid var(--color-highlight);
      }

      @media (max-width: 768px) {
         .contact-form {
            padding: 24px;
         }
      }

      .form-group {
         margin-bottom: 24px;
      }

      .form-group label {
         display: block;
         margin-bottom: 8px;
         font-weight: 700;
         color: var(--color-primary);
         font-size: 0.95rem;
      }

      .form-group input,
      .form-group textarea {
         width: 100%;
         padding: 12px;
         border: 1px solid #ddd;
         border-radius: var(--border-radius);
         font-family: 'Lato', sans-serif;
         font-size: 1rem;
         transition: var(--transition);
      }

      .form-group input:focus,
      .form-group textarea:focus {
         outline: none;
         border-color: var(--color-highlight);
         box-shadow: 0 0 0 3px var(--color-highlight-light);
      }

      .form-group textarea {
         min-height: 150px;
         resize: vertical;
      }

      .btn-full {
         width: 100%;
         display: block;
         text-align: center;
         padding: 16px;
         background: var(--color-primary);
         color: white;
         border: none;
         border-radius: var(--border-radius);
         font-size: 1rem;
         font-weight: 700;
         cursor: pointer;
         transition: var(--transition);
      }

      .btn-full:hover {
         background: var(--color-primary-dark);
         transform: translateY(-2px);
      }

      .faq-box {
         margin-top: 60px;
         background: var(--color-background-warm);
         padding: 40px;
         border-radius: var(--border-radius-lg);
         border-left: 4px solid var(--color-accent);
      }

      .faq-box h2 {
         font-size: 1.5rem;
         margin-bottom: 24px;
         text-align: center;
         color: var(--color-primary);
      }

      .faq-item {
         margin-bottom: 24px;
      }

      .faq-item:last-child {
         margin-bottom: 0;
      }

      .faq-q {
         font-weight: 700;
         color: var(--color-primary);
         margin-bottom: 8px;
         display: flex;
         align-items: center;
         gap: 10px;
      }

      .faq-q i {
         color: var(--color-accent);
      }

      .faq-a {
         font-size: 0.95rem;
         color: var(--color-text-muted);
         padding-left: 26px;
      }
   </style>
</head>

<body>
   <div id="global-header"></div>

   <div class="contact-layout">
      <div class="page-header">
         <h1>Let's Connect</h1>
         <p>Parenting a "Ferrari Brain" child is a team sport. Whether you have a question about the tech or just need to vent about a sensory meltdown, we are listening.</p>
      </div>

      <form class="contact-form" id="contactForm">
         <div class="form-group">
            <label>Name</label>
            <input type="text" placeholder="Your name" required>
         </div>
         <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="your@email.com" required>
         </div>
         <div class="form-group">
            <label>Subject</label>
            <input type="text" placeholder="What's on your mind?" required>
         </div>
         <div class="form-group">
            <label>Message</label>
            <textarea placeholder="Tell us how we can help..." required>
