<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>The "Ferrari Brain" Assessment | Navigator Kids AI™</title>

   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

   <link rel="stylesheet" href="styles.css">

   <style>
      /* === VARIABLES === */
      :root {
         --color-primary: #1B365D;
         --color-primary-dark: #132845;
         --color-primary-light: #2A4A7A;
         --color-secondary: #FFFFFF;
         --color-accent: #E9C46A;
         --color-accent-light: #F4D78A;
         --color-highlight: #2A9D8F;
         --color-highlight-dark: #238579;
         --color-highlight-light: #E8F4F2;
         --color-text: #2F2F2F;
         --color-text-muted: #666666;
         --color-background: #F4F6F8;
         --color-background-warm: #FFFBF5;
         --border-radius: 8px;
         --border-radius-lg: 12px;
         --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
         --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
         --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
         --transition: all 0.2s ease;
         --font-header: 'Inter', sans-serif;
         --font-body: 'Lato', sans-serif;
      }

      /* === GLOBAL RESET === */
      *,
      *::before,
      *::after {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
      }

      html {
         scroll-behavior: smooth;
      }

      body {
         font-family: var(--font-body);
         color: var(--color-text);
         line-height: 1.7;
         background-color: var(--color-background);
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
         font-family: var(--font-header);
         line-height: 1.3;
         color: var(--color-primary);
      }

      a {
         text-decoration: none;
         color: inherit;
      }

      ul,
      ol {
         margin-left: 24px;
      }

      li {
         margin-bottom: 8px;
      }

      .container {
         width: 100%;
         max-width: 800px;
         /* Reduced for quiz focus */
         margin: 0 auto;
         padding: 40px 24px;
      }

      /* --- QUIZ STYLES --- */
      .progress-container {
         margin-bottom: 40px;
      }

      .progress-bar {
         height: 8px;
         background-color: #E2E8F0;
         border-radius: 4px;
         overflow: hidden;
      }

      .progress-fill {
         background-color: var(--color-highlight);
         height: 100%;
         width: 0%;
         transition: width 0.3s ease;
      }

      .progress-text {
         color: var(--color-text-muted);
         font-size: 0.875rem;
         margin-top: 8px;
         text-align: right;
         font-weight: 600;
      }

      .question-container {
         margin-bottom: 32px;
         text-align: center;
      }

      .question {
         font-size: 1.75rem;
         color: var(--color-primary);
         margin-bottom: 0;
      }

      .answers-container {
         display: flex;
         flex-direction: column;
         gap: 16px;
      }

      .answer-card {
         background: white;
         border: 2px solid transparent;
         border-radius: var(--border-radius-lg);
         padding: 24px;
         box-shadow: var(--shadow-sm);
         font-size: 1.1rem;
         color: var(--color-text);
         cursor: pointer;
         transition: var(--transition);
      }

      .answer-card:hover {
         transform: translateY(-2px);
         box-shadow: var(--shadow-md);
         border-color: var(--color-highlight-light);
      }

      .answer-card.selected {
         border-color: var(--color-highlight);
         background-color: var(--color-highlight-light);
         color: var(--color-highlight-dark);
         font-weight: 600;
      }

      .loading {
         text-align: center;
         font-size: 1.2rem;
         color: var(--color-text-muted);
         margin-top: 40px;
         display: none;
      }

      .results-container {
         display: none;
         text-align: center;
         background: white;
         padding: 48px;
         border-radius: var(--border-radius-lg);
         box-shadow: var(--shadow-lg);
         border-top: 4px solid var(--color-highlight);
      }

      .results-title {
         font-size: 2rem;
         margin-bottom: 16px;
         color: var(--color-primary);
      }

      .results-text {
         font-size: 1.1rem;
         color: var(--color-text-muted);
         margin-bottom: 32px;
      }

      .btn {
         display: inline-block;
         background-color: var(--color-highlight);
         color: white;
         padding: 16px 32px;
         border-radius: var(--border-radius);
         font-weight: 700;
         font-size: 1.1rem;
         transition: var(--transition);
         box-shadow: var(--shadow-md);
      }

      .btn:hover {
         background-color: var(--color-highlight-dark);
         transform: translateY(-2px);
         box-shadow: var(--shadow-lg);
      }
   </style>
</head>

<body>
   <div id="global-header"></div>

   <div class="container">
      <div class="progress-container">
         <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
         </div>
         <div class="progress-text" id="progressText">Question 1 of 10</div>
      </div>

      <div class="question-container">
         <h2 class="question" id="questionText">Loading question...</h2>
      </div>

      <div class="answers-container" id="answersContainer">
      </div>

      <div class="loading" id="loadingIndicator">
         Analyzing your answers...
      </div>

      <div class="results-container" id="resultsContainer">
         <h2 class="results-title">Profile Identified</h2>
         <p class="results-text">We've mapped your child's unique traits. It looks like you have a specialized thinker on your hands.</p>
         <a href="result-deep-thinker.html" class="btn" id="resultsButton">Reveal My Child's Profile</a>
      </div>
   </div>

   <div id="global-footer"></div>

   <script src="script.js"></script>
   <script>
      // Quiz Logic - Refactored for Lived Experience Voice
      const quizData = [{
            question: "The 'New Place' Protocol: When you walk into a busy birthday party or a new classroom, what is their immediate go-to move?",
            answers: [
               "Leads the charge—they are already in the center of the room.",
               "Stands back and observes—they need to map the room before entering.",
               "Hides behind my leg—the noise and chaos are instantly too much.",
               "Asks a million questions—'How long are we staying? Who is that?'"
            ]
         },
         {
            question: "The 'Glitch' Response: When the Lego tower falls over or the iPad freezes, what happens next?",
            answers: [
               "Methodically rebuilds it—they have a plan.",
               "Total meltdown—it feels like the end of the world.",
               "Immediately asks for help—they don't like struggling alone.",
               "Invents a new game where the tower was *supposed* to fall."
            ]
         },
         {
            question: "The 'Lawyer' Phase: If you say 'Because I said so,' what is the likely response?",
            answers: [
               "Accepts it (rarely).",
               "Demands a logical evidence-based explanation.",
               "Ignores you completely and keeps doing what they were doing.",
               "Becomes anxious that they are in trouble."
            ]
         },
         {
            question: "The Battery Life: How does their energy fluctuate?",
            answers: [
               "Energizer Bunny—they literally vibrate with energy all day.",
               "Bursts and Crashes—hyper-focused for hours, then exhausted.",
               "Steady but Low—they prefer quiet activities.",
               "Night Owl—they come alive right when you want to go to sleep."
            ]
         },
         {
            question: "The 'Deep Dive': When they get interested in a topic (Dinosaurs, Space, Minecraft), what does it look like?",
            answers: [
               "They like it, but they move on to the next thing quickly.",
               "It becomes their entire personality for 3 months.",
               "They create elaborate stories and worlds around it.",
               "They memorize every statistic and correct adults who get it wrong."
            ]
         },
         {
            question: "The Texture Test: How do they handle clothing?",
            answers: [
               "Will wear anything.",
               "Specific fabrics only—seams and tags are the enemy.",
               "Prefers tight/heavy clothing (like hoodies in summer).",
               "Prefers loose/minimal clothing (always shirtless if allowed)."
            ]
         },
         {
            question: "The Download Speed: How do they learn new concepts?",
            answers: [
               "Step-by-step—they need the instructions.",
               "Instantly—they 'get it' before you finish explaining.",
               "Through their hands—they need to touch and break it.",
               "Through connection—they learn best if they like the teacher."
            ]
         },
         {
            question: "The Social Battery: After a day at school, they are:",
            answers: [
               "Ready to talk for 2 hours straight.",
               "A zombie—they need an hour of silence to reboot.",
               "Explosive—they held it together all day and now they fall apart.",
               "Needy—they want constant physical affection."
            ]
         },
         {
            question: "The Justice League: How do they handle unfairness?",
            answers: [
               "They don't really notice.",
               "They get upset but move on.",
               "They are deeply disturbed by injustice, even in movies/news.",
               "They become the 'rule police' for other kids."
            ]
         },
         {
            question: "The 'Why': What is their favorite question?",
            answers: [
               "Can I have a snack?",
               "Why does that work?",
               "What if...?",
               "But is that actually true?"
            ]
         }
      ];

      let currentQuestion = 0;
      let selectedAnswers = Array(quizData.length).fill(null);

      const questionText = document.getElementById('questionText');
      const answersContainer = document.getElementById('answersContainer');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const loadingIndicator = document.getElementById('loadingIndicator');
      const resultsContainer = document.getElementById('resultsContainer');

      function initQuiz() {
         showQuestion();
      }

      function showQuestion() {
         const question = quizData[currentQuestion];
         questionText.textContent = question.question;
         answersContainer.innerHTML = '';

         question.answers.forEach((answer, index) => {
            const answerCard = document.createElement('div');
            answerCard.className = 'answer-card';
            answerCard.textContent = answer;

            if (selectedAnswers[currentQuestion] === index) {
               answerCard.classList.add('selected');
            }

            answerCard.addEventListener('click', () => selectAnswer(index, answerCard));
            answersContainer.appendChild(answerCard);
         });

         updateProgress();
      }

      function selectAnswer(answerIndex, selectedCard) {
         document.querySelectorAll('.answer-card').forEach(card => {
            card.classList.remove('selected');
         });
         selectedCard.classList.add('selected');
         selectedAnswers[currentQuestion] = answerIndex;

         setTimeout(() => {
            if (currentQuestion < quizData.length - 1) {
               currentQuestion++;
               showQuestion();
            } else {
               showResults();
            }
         }, 300);
      }

      function updateProgress() {
         const progressPercent = ((currentQuestion + 1) / quizData.length) * 100;
         progressFill.style.width = `${progressPercent}%`;
         progressText.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
      }

      function showResults() {
         document.querySelector('.question-container').style.display = 'none';
         document.querySelector('.answers-container').style.display = 'none';
         document.querySelector('.progress-container').style.display = 'none';
         loadingIndicator.style.display = 'block';

         // Simulate processing time
         setTimeout(() => {
            loadingIndicator.style.display = 'none';
            resultsContainer.style.display = 'block';
         }, 1500);
      }

      window.addEventListener('DOMContentLoaded', initQuiz);
   </script>
</body>

</html>
