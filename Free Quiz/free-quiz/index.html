<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>The Parenting Pivot Assessment | Navigator Kids AI™</title>

   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

   <style>
      /* === VARIABLES (Imported from index.html) === */
      :root {
         --color-primary: #1B365D;
         --color-primary-dark: #132845;
         --color-primary-light: #2A4A7A;
         --color-secondary: #FFFFFF;
         --color-accent: #E9C46A;
         --color-accent-light: #F4D78A;
         --color-highlight: #2A9D8F;
         --color-highlight-dark: #238579;
         --color-highlight-light: #E8F4F2;
         --color-text: #2F2F2F;
         --color-text-muted: #666666;
         --color-background: #F4F6F8;
         --border-radius: 8px;
         --border-radius-lg: 12px;
         --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
         --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
         --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
         --transition: all 0.2s ease;
         --font-header: 'Inter', sans-serif;
         --font-body: 'Lato', sans-serif;
      }

      /* === GLOBAL RESET === */
      *,
      *::before,
      *::after {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
      }

      body {
         font-family: var(--font-body);
         color: var(--color-text);
         line-height: 1.7;
         background-color: var(--color-background);
      }

      h1,
      h2,
      h3,
      h4 {
         font-family: var(--font-header);
         color: var(--color-primary);
      }

      a {
         text-decoration: none;
         color: inherit;
      }

      /* --- NAVIGATION (Simplified for Quiz Focus) --- */
      .navbar {
         background-color: #FFFFFF;
         border-bottom: 1px solid rgba(27, 54, 93, 0.08);
         padding: 16px 24px;
         box-shadow: var(--shadow-sm);
      }

      .navbar-container {
         max-width: 1200px;
         margin: 0 auto;
         display: flex;
         justify-content: space-between;
         align-items: center;
      }

      .logo a {
         font-family: var(--font-header);
         font-size: 1.25rem;
         font-weight: 800;
         color: var(--color-primary);
         display: flex;
         align-items: center;
         gap: 10px;
      }

      .logo i {
         color: var(--color-highlight);
         font-size: 1.4rem;
      }

      /* --- QUIZ CONTAINER --- */
      .container {
         width: 100%;
         max-width: 800px;
         margin: 0 auto;
         padding: 40px 24px;
         min-height: 80vh;
      }

      /* --- PROGRESS BAR --- */
      .progress-container {
         margin-bottom: 40px;
      }

      .progress-bar {
         height: 8px;
         background-color: #E2E8F0;
         border-radius: 4px;
         overflow: hidden;
      }

      .progress-fill {
         background-color: var(--color-highlight);
         height: 100%;
         width: 0%;
         transition: width 0.3s ease;
      }

      .progress-text {
         color: var(--color-text-muted);
         font-size: 0.875rem;
         margin-top: 8px;
         text-align: right;
         font-weight: 600;
      }

      /* --- QUESTIONS --- */
      .question-container {
         margin-bottom: 32px;
         text-align: center;
      }

      .question-tag {
         display: inline-block;
         background: var(--color-highlight-light);
         color: var(--color-highlight-dark);
         padding: 4px 12px;
         border-radius: 20px;
         font-size: 0.8rem;
         font-weight: 700;
         margin-bottom: 16px;
         text-transform: uppercase;
         letter-spacing: 0.5px;
      }

      .question {
         font-size: 1.75rem;
         color: var(--color-primary);
         margin-bottom: 10px;
         font-weight: 700;
      }

      /* --- ANSWERS --- */
      .answers-container {
         display: flex;
         flex-direction: column;
         gap: 16px;
      }

      .answer-card {
         background: white;
         border: 2px solid transparent;
         border-radius: var(--border-radius-lg);
         padding: 24px;
         box-shadow: var(--shadow-sm);
         font-size: 1.1rem;
         color: var(--color-text);
         cursor: pointer;
         transition: var(--transition);
         display: flex;
         align-items: center;
      }

      .answer-card:hover {
         transform: translateY(-2px);
         box-shadow: var(--shadow-md);
         border-color: var(--color-highlight-light);
      }

      .answer-card.selected {
         border-color: var(--color-highlight);
         background-color: var(--color-highlight-light);
         color: var(--color-highlight-dark);
         font-weight: 600;
      }

      .answer-letter {
         background: var(--color-background);
         color: var(--color-primary);
         width: 32px;
         height: 32px;
         border-radius: 50%;
         display: flex;
         align-items: center;
         justify-content: center;
         font-weight: 700;
         margin-right: 16px;
         flex-shrink: 0;
      }

      .answer-card.selected .answer-letter {
         background: var(--color-highlight);
         color: white;
      }

      /* --- LOADING & ANIMATION --- */
      .loading {
         text-align: center;
         margin-top: 60px;
         display: none;
      }

      .spinner {
         border: 4px solid rgba(0, 0, 0, 0.1);
         width: 50px;
         height: 50px;
         border-radius: 50%;
         border-left-color: var(--color-highlight);
         animation: spin 1s linear infinite;
         margin: 0 auto 20px;
      }

      @keyframes spin {
         0% {
            transform: rotate(0deg);
         }

         100% {
            transform: rotate(360deg);
         }
      }

      .loading-text {
         font-size: 1.25rem;
         color: var(--color-primary);
         font-weight: 600;
      }

      .loading-subtext {
         color: var(--color-text-muted);
         margin-top: 8px;
      }

      /* --- FOOTER --- */
      .footer {
         text-align: center;
         margin-top: 60px;
         padding: 20px;
         border-top: 1px solid #eee;
         color: var(--color-text-muted);
         font-size: 0.9rem;
      }
   </style>
</head>

<body>

   <header class="navbar">
      <div class="navbar-container">
         <div class="logo">
            <a href="index.html">
               <i class="fas fa-compass"></i>
               Navigator <span>Kids AI</span>
            </a>
         </div>
      </div>
   </header>

   <div class="container">

      <div class="progress-container" id="progressContainer">
         <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
         </div>
         <div class="progress-text" id="progressText">Question 1 of 11</div>
      </div>

      <div class="question-container" id="questionBlock">
         <span class="question-tag" id="questionTag">Identity & Personality</span>
         <h2 class="question" id="questionText">Loading...</h2>
      </div>

      <div class="answers-container" id="answersContainer">
      </div>

      <div class="loading" id="loadingIndicator">
         <div class="spinner"></div>
         <div class="loading-text">Analyzing Regulation Style...</div>
         <p class="loading-subtext">Mapping results to the 6 Core Profiles.</p>
      </div>

   </div>

   <footer class="footer">
      <p>© 2025 Navigator Kids AI™. Science-backed parenting tools.</p>
   </footer>

   <script>
      // --- 1. DEFINITIONS ---
      // Profile Keys: EO (Emotional Overload), EF (Exec Function), DT (Deep Thinker), 
      // AN (Anxiety), SE (Sensory), SW (Strong-Willed)

      const questions = [
         // SECTION A: Identity & Rapport
         {
            category: "Identity & Personality",
            text: "When your child is at their best (their 'superpower'), they are:",
            answers: [{
                  text: "Incredibly empathetic and feels things deeply.",
                  weights: {
                     EO: 2,
                     DT: 1
                  }
               },
               {
                  text: "Creative, energetic, and full of big ideas.",
                  weights: {
                     EF: 2,
                     SW: 1
                  }
               },
               {
                  text: "Highly observant, logical, and detail-oriented.",
                  weights: {
                     DT: 2,
                     AN: 1
                  }
               },
               {
                  text: "Passionate, determined, and a born leader.",
                  weights: {
                     SW: 3
                  }
               }
            ]
         },
         {
            category: "Identity & Personality",
            text: "How does your child typically play or engage with hobbies?",
            answers: [{
                  text: "Jumps from one activity to another, leaving a mess behind.",
                  weights: {
                     EF: 3
                  }
               },
               {
                  text: "Can play with the same Lego set or book for hours (hyper-focus).",
                  weights: {
                     DT: 1,
                     SE: 1
                  }
               },
               {
                  text: "Needs to be in charge of the rules and how others play.",
                  weights: {
                     SW: 2
                  }
               },
               {
                  text: "Prefers playing alone or in quiet, controlled environments.",
                  weights: {
                     AN: 2,
                     SE: 1
                  }
               }
            ]
         },
         {
            category: "Communication Style",
            text: "What is the most common phrase you hear from your child?",
            answers: [{
                  text: "\"It's not fair!\" or \"You don't understand!\"",
                  weights: {
                     EO: 3
                  }
               },
               {
                  text: "\"I forgot\" or \"I was going to do it.\"",
                  weights: {
                     EF: 3
                  }
               },
               {
                  text: "\"What if...\" or \"I can't do it, it's too hard.\"",
                  weights: {
                     AN: 3
                  }
               },
               {
                  text: "\"No!\" or \"You can't make me!\"",
                  weights: {
                     SW: 3
                  }
               }
            ]
         },
         {
            category: "Adaptability",
            text: "How does your child handle a sudden change in plans?",
            answers: [{
                  text: "Immediate tears or anger; takes a long time to calm down.",
                  weights: {
                     EO: 3
                  }
               },
               {
                  text: "They get confused or disorganized, forgetting what they were doing.",
                  weights: {
                     EF: 2
                  }
               },
               {
                  text: "They worry about details: \"When? Why? Who will be there?\"",
                  weights: {
                     DT: 1,
                     AN: 2
                  }
               },
               {
                  text: "Complete refusal to go along with the new plan.",
                  weights: {
                     SW: 3
                  }
               }
            ]
         },
         // SECTION B: Regulation & Friction
         {
            category: "Daily Friction",
            text: "What does 'homework time' or a 'chore request' usually look like?",
            answers: [{
                  text: "A battle of wills—power struggles and negotiations.",
                  weights: {
                     SW: 3
                  }
               },
               {
                  text: "Procrastination, losing papers, or staring at the page.",
                  weights: {
                     EF: 3
                  }
               },
               {
                  text: "Perfectionism—erasing repeatedly or crying over mistakes.",
                  weights: {
                     DT: 3
                  }
               },
               {
                  text: "Avoidance—hiding, shutting down, or saying they feel sick.",
                  weights: {
                     AN: 3
                  }
               }
            ]
         },
         {
            category: "Triggers",
            text: "When a meltdown happens, what is the primary trigger?",
            answers: [{
                  text: "Being told 'no' or having a limit set.",
                  weights: {
                     SW: 2,
                     EO: 1
                  }
               },
               {
                  text: "Sensory things—socks feel wrong, lights, noise.",
                  weights: {
                     SE: 4
                  }
               },
               {
                  text: "Feeling overwhelmed by too many steps/instructions.",
                  weights: {
                     EF: 2
                  }
               },
               {
                  text: "Fear of failure or feeling embarrassed.",
                  weights: {
                     AN: 2,
                     DT: 1
                  }
               }
            ]
         },
         {
            category: "Reactions",
            text: "How intense are their physical reactions?",
            answers: [{
                  text: "Zero to 100 instantly—screaming, throwing things.",
                  weights: {
                     EO: 2,
                     SW: 1
                  }
               },
               {
                  text: "They physically shut down, curl into a ball, or go silent.",
                  weights: {
                     AN: 2,
                     DT: 1
                  }
               },
               {
                  text: "Restless—fidgeting, chewing on things, crashing into furniture.",
                  weights: {
                     SE: 2,
                     EF: 1
                  }
               },
               {
                  text: "Whiny and irritable, but usually manageable.",
                  weights: {}
               } // General/Low Urgency
            ]
         },
         {
            category: "Routine",
            text: "What is the hardest part of the daily routine?",
            answers: [{
                  text: "Mornings—getting dressed, eating, and leaving is chaotic.",
                  weights: {
                     EF: 2,
                     SE: 1
                  }
               },
               {
                  text: "Transitions—moving from screens to dinner, etc.",
                  weights: {
                     SW: 2
                  }
               },
               {
                  text: "Bedtime—racing thoughts, fears, or needing you nearby.",
                  weights: {
                     DT: 1,
                     AN: 2
                  }
               },
               {
                  text: "After school—fine at school, explodes at home.",
                  weights: {
                     EO: 3
                  }
               }
            ]
         },
         // SECTION C: Parent Experience
         {
            category: "Parent Impact",
            text: "How does your child's behavior impact YOU emotionally?",
            answers: [{
                  text: "I feel like I'm walking on eggshells constantly.",
                  weights: {
                     SW: 1,
                     EO: 1
                  },
                  urgency: "medium"
               },
               {
                  text: "I feel exhausted from micromanaging and reminding them.",
                  weights: {
                     EF: 2
                  }
               },
               {
                  text: "I feel heartbroken seeing them struggle with worry.",
                  weights: {
                     AN: 2
                  }
               },
               {
                  text: "I feel burnt out and resentful; I have nothing left to give.",
                  weights: {},
                  urgency: "high"
               }
            ]
         },
         {
            category: "Past Attempts",
            text: "Why do you think traditional discipline (timeouts, charts) hasn't worked?",
            answers: [{
                  text: "They don't care about rewards/punishments; nothing motivates them.",
                  weights: {
                     SW: 3
                  }
               },
               {
                  text: "They want to be good, but their impulses take over.",
                  weights: {
                     EF: 2,
                     EO: 2
                  }
               },
               {
                  text: "They take correction personally and shame spiral.",
                  weights: {
                     DT: 2,
                     AN: 1
                  }
               },
               {
                  text: "It makes the meltdowns significantly worse.",
                  weights: {
                     SE: 2
                  }
               }
            ]
         },
         {
            category: "Urgency Check",
            text: "Honesty check: How often is the atmosphere in your home tense or chaotic?",
            answers: [{
                  text: "Once or twice a week.",
                  weights: {},
                  urgency: "low"
               },
               {
                  text: "Almost every day.",
                  weights: {},
                  urgency: "medium"
               },
               {
                  text: "Multiple times a day—it feels constant.",
                  weights: {},
                  urgency: "critical"
               },
               {
                  text: "Only during specific stressful seasons.",
                  weights: {},
                  urgency: "low"
               }
            ]
         }
      ];

      // --- 2. STATE MANAGEMENT ---
      let currentQuestion = 0;
      let scores = {
         EO: 0,
         EF: 0,
         DT: 0,
         AN: 0,
         SE: 0,
         SW: 0
      };
      let urgencyLevel = "low"; // low, medium, high, critical

      // --- 3. DOM ELEMENTS ---
      const questionText = document.getElementById('questionText');
      const questionTag = document.getElementById('questionTag');
      const answersContainer = document.getElementById('answersContainer');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const loadingIndicator = document.getElementById('loadingIndicator');
      const questionBlock = document.getElementById('questionBlock');
      const progressContainer = document.getElementById('progressContainer');

      // --- 4. INITIALIZATION ---
      function initQuiz() {
         renderQuestion();
      }

      // --- 5. RENDER FUNCTIONS ---
      function renderQuestion() {
         const q = questions[currentQuestion];

         // Update Text
         questionTag.textContent = q.category;
         questionText.textContent = q.text;
         progressText.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;

         // Update Progress Bar
         const percent = ((currentQuestion) / questions.length) * 100;
         progressFill.style.width = `${percent}%`;

         // Render Answers
         answersContainer.innerHTML = '';
         const letters = ['A', 'B', 'C', 'D'];

         q.answers.forEach((ans, index) => {
            const card = document.createElement('div');
            card.className = 'answer-card';
            card.innerHTML = `<div class="answer-letter">${letters[index]}</div> ${ans.text}`;

            // Add Click Event
            card.addEventListener('click', () => handleSelection(ans, card));

            answersContainer.appendChild(card);
         });
      }

      // --- 6. LOGIC HANDLING ---
      function handleSelection(answerObj, cardElem) {
         // Visual Feedback
         const allCards = document.querySelectorAll('.answer-card');
         allCards.forEach(c => c.style.pointerEvents = 'none'); // Prevent double click
         cardElem.classList.add('selected');

         // 1. Update Scores
         for (const [profile, weight] of Object.entries(answerObj.weights)) {
            if (scores.hasOwnProperty(profile)) {
               scores[profile] += weight;
            }
         }

         // 2. Update Urgency (if applicable)
         if (answerObj.urgency) {
            // Upgrade urgency if the new selection is more severe
            const levels = {
               "low": 1,
               "medium": 2,
               "high": 3,
               "critical": 4
            };
            if (levels[answerObj.urgency] > levels[urgencyLevel]) {
               urgencyLevel = answerObj.urgency;
            }
         }

         // 3. Move to Next
         setTimeout(() => {
            if (currentQuestion < questions.length - 1) {
               currentQuestion++;
               renderQuestion();
            } else {
               finishQuiz();
            }
         }, 350); // Short delay for visual confirmation
      }

      function finishQuiz() {
         // Hide Quiz UI
         questionBlock.style.display = 'none';
         answersContainer.style.display = 'none';
         progressContainer.style.display = 'none';

         // Show Loading UI
         loadingIndicator.style.display = 'block';

         // Calculate Result
         const resultProfile = calculateWinner();

         // Simulate Processing Time then Redirect
         setTimeout(() => {
            // Redirect to result page with urgency param
            const url = `result-${resultProfile.slug}.html?urgency=${urgencyLevel}`;
            window.location.href = url;
         }, 2000);
      }

      function calculateWinner() {
         // Sort profiles by score descending
         let sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
         let winnerKey = sorted[0];
         let runnerUp = sorted[1];

         // Tie-Breaker Logic
         if (scores[winnerKey] === scores[runnerUp]) {
            // Rule 1: SW wins all ties (requires most distinct approach)
            if (winnerKey === 'SW' || runnerUp === 'SW') winnerKey = 'SW';
            // Rule 2: AN wins tie with EO (Anxiety is often root of overload)
            else if ((winnerKey === 'EO' && runnerUp === 'AN') || (winnerKey === 'AN' && runnerUp === 'EO')) winnerKey = 'AN';
         }

         // Map Key to Filename Slug
         const profileMap = {
            'EO': 'emotional-overload',
            'EF': 'executive-function',
            'DT': 'deep-thinker',
            'AN': 'anxiety-avoider',
            'SE': 'sensitive-sensor',
            'SW': 'autonomy-seeker'
         };

         return {
            key: winnerKey,
            slug: profileMap[winnerKey]
         };
      }

      // Start
      document.addEventListener('DOMContentLoaded', initQuiz);
   </script>

</body>

</html>
